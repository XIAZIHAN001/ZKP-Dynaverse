[package]
name = "dynaverse-bench"
default-run = "dynaverse-bench"
version.workspace = true
edition.workspace = true

[features]
default = []
icicle = ["dynaverse-gpu/icicle"]

[dependencies]
dynaverse-protocol = { path = "../protocol" }
dynaverse-gpu = { path = "../gpu" }
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-bn254 = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "cpu_dynamo"
harness = false
