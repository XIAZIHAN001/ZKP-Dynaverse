   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="55.336875" transform="rotate(-0 39.6 55.336875)">GPU Setup：并行之外，减少昂贵的单点工作</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="96.121641" transform="rotate(-0 39.6 96.121641)">三种机制分别处理参数点生成、坐标转换和 G2 校验。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="212.4" y="181.018594" transform="rotate(-0 212.4 181.018594)">固定基点查表</text>
   </g>
   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(132.4 282.523438)">相同基点反复使用</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(212.4 310.677188)"/>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(152.4 338.830938)">先构造窗口表</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(132.4 366.984688)">再由设备批量生成</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(212.4 395.138438)"/>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(162.4 423.292188)">省重复准备</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="181.018594" transform="rotate(-0 576 181.018594)">批量归一化</text>
   </g>
   <g id="text_6">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(506 282.523438)">逐点求逆代价高</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(576 310.677188)"/>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(487.76875 338.830938)">128 点组成一个 tile</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(482.664062 366.984688)">一次求逆 + 乘法回代</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(576 395.138438)"/>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(516 423.292188)">减少昂贵求逆</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="939.6" y="181.018594" transform="rotate(-0 939.6 181.018594)">等价 G2 子群判断</text>
   </g>
   <g id="text_8">
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(859.6 282.523438)">完整阶乘法较昂贵</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(939.6 310.677188)"/>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(884.64375 338.830938)">BN254 专用</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(857.884375 366.984688)">Frobenius63 关系</text>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(939.6 395.138438)"/>
    <text style="font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(869.6 423.292188)">逐点检查仍保留</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="567.107813" transform="rotate(-0 576 567.107813)">规范编码与曲线检查仍是前提；不是省略或随机抵消验证。</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="628.105469" transform="rotate(-0 39.6 628.105469)">GPU63 是早期本地显式校验路径；不能将后期 H200 Setup 全部收益归因于它。</text>
   </g>
  </g>
 </g>
