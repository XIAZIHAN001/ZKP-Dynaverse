   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="54.786328" transform="rotate(-0 39.6 54.786328)">固定数据缓存：保存计算材料，不保存验收结论</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="96.121641" transform="rotate(-0 39.6 96.121641)">Dᵢ = τG₂ − ωᵢG₂ 只依赖固定 SRS 与域根；τG₂ 是公开 SRS 点。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="194.4" y="181.018594" transform="rotate(-0 194.4 181.018594)">固定公开输入</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="194.4" y="235.357031" transform="rotate(-0 194.4 235.357031)">SRS、域、根 ωᵢ</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="579.6" y="181.018594" transform="rotate(-0 579.6 181.018594)">一次性预计算</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(498.264297 223.356688)">Dᵢ 坐标 / G2 prepare</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(494.6 247.287375)">两类缓存避免不同工作</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="961.2" y="181.018594" transform="rotate(-0 961.2 181.018594)">后续调用复用</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(907.2 222.687844)">省去重复构造</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(916.2 248.026219)">或配对准备</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="234" y="400.618594" transform="rotate(-0 234 400.618594)">每次变化的新输入</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(135.178594 444.369094)">新承诺、opening、数值</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(144 469.811531)">仍需证明本次关系成立</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="844.2" y="400.618594" transform="rotate(-0 844.2 400.618594)">每次独立方程检查</text>
   </g>
   <g id="text_12">
    <text style="font-size: 19px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(725.518281 444.030484)">Miller loop 与最终幂仍执行</text>
    <text style="font-size: 19px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(717.628828 470.776547)">正式协议的配对算术仍在 CPU</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="578.733984" transform="rotate(-0 576 578.733984)">类比：复用量具；每一件新产品仍重新检验。</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="628.105469" transform="rotate(-0 39.6 628.105469)">缓存有初始化与内存成本；prepared 容量和全域 divisor 缓存的实验不能混为一谈。</text>
   </g>
  </g>
