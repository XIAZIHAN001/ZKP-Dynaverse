   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="54.786328" transform="rotate(-0 39.6 54.786328)">增量与分步重建：先补差量，再刷新基准</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="96.121641" transform="rotate(-0 39.6 96.121641)">承诺的线性可以复用；完整协议仍须处理非线性约束与独立检查。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="190.8" y="184.618594" transform="rotate(-0 190.8 184.618594)">已有 anchor</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="190.8" y="235.357031" transform="rotate(-0 190.8 235.357031)">W₀ 及其证明材料</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="184.618594" transform="rotate(-0 576 184.618594)">少量变化 ΔW</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="235.357031" transform="rotate(-0 576 235.357031)">按变化索引计算贡献</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="961.2" y="184.618594" transform="rotate(-0 961.2 184.618594)">当前 witness</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="961.2" y="235.357031" transform="rotate(-0 961.2 235.357031)">W₀ + ΔW</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 28px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="335.310937" transform="rotate(-0 576 335.310937)">线性部分：C(W₀ + ΔW) = C(W₀) + C(ΔW)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="190.8" y="422.218594" transform="rotate(-0 190.8 422.218594)">变化积累到条件</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(139.8 465.599191)">冻结一次快照</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(107.943594 490.465809)">后续新变化记 overlay</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="422.218594" transform="rotate(-0 576 422.218594)">按预算推进重建</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(490.143359 466.431062)">可由多笔 Update 分摊</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(491 490.36175)">不等同于专用后台线程</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="961.2" y="422.218594" transform="rotate(-0 961.2 422.218594)">通过检查后切换</text>
   </g>
   <g id="text_15">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(896.601328 465.670445)">安装新的 anchor</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(884.328125 490.394555)">保留 overlay 的贡献</text>
   </g>
   <g id="text_16">
    <text style="font-size: 19px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="580.154609" transform="rotate(-0 576 580.154609)">乘法增量还包含交叉项；完整 Rebuild 不能统称为 O(|Δ|)。</text>
   </g>
   <g id="text_17">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="627.820078" transform="rotate(-0 39.6 627.820078)">原理示意。anchor + delta 是证明结构描述，不意味着所有证明项可以直接相加。</text>
   </g>
  </g>
