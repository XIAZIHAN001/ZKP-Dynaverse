   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="54.786328" transform="rotate(-0 39.6 54.786328)">固定基点预计算：相同准备只做一次</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="96.121641" transform="rotate(-0 39.6 96.121641)">一批标量作用于相同曲线点 G；标量乘不是普通整数乘法。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="168.333984" transform="rotate(-0 39.6 168.333984)">原来</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="320.4" y="177.418594" transform="rotate(-0 320.4 177.418594)">s₁G</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="320.4" y="227.881641" transform="rotate(-0 320.4 227.881641)">重复准备倍点与加点</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="640.8" y="177.418594" transform="rotate(-0 640.8 177.418594)">s₂G</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="640.8" y="227.881641" transform="rotate(-0 640.8 227.881641)">重复准备倍点与加点</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="961.2" y="177.418594" transform="rotate(-0 961.2 177.418594)">s₃G</text>
   </g>
   <g id="text_9">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="961.2" y="227.881641" transform="rotate(-0 961.2 227.881641)">重复准备倍点与加点</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="341.133984" transform="rotate(-0 39.6 341.133984)">改后</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="199.8" y="404.218594" transform="rotate(-0 199.8 404.218594)">预计算窗口表</text>
   </g>
   <g id="text_12">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(127.8 449.487844)">为各窗口位置保存</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(113.468906 474.826219)">4-bit 分段所需曲线点</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576.36" y="404.218594" transform="rotate(-0 576.36 404.218594)">标量分段并查表</text>
   </g>
   <g id="text_14">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(481.116094 449.487844)">同一 owner 的多次调用</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(495.36 474.826219)">复用表，不重复准备</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="952.2" y="404.218594" transform="rotate(-0 952.2 404.218594)">累加得到 sᵢG</text>
   </g>
   <g id="text_16">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(871.2 448.978078)">结果与原标量乘一致</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(870.588281 475.335984)">首次建表计入 Setup</text>
   </g>
   <g id="text_17">
    <text style="font-size: 21px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="578.183203" transform="rotate(-0 576 578.183203)">省下重复准备；代价是一次建表时间与保留空间。</text>
   </g>
   <g id="text_18">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="627.820078" transform="rotate(-0 39.6 627.820078)">机制示意，非时间轴；VarMSM 的不同基点不能直接共用这张固定基点表。</text>
   </g>
