   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="39.6" y="54.786328" transform="rotate(-0 39.6 54.786328)">先复现核心流程：从基准证明到连续更新</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="96.453672" transform="rotate(-0 39.6 96.453672)">Setup、Session、Update、Rebuild 各有职责；Update 不负责自动求新 witness。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="158.4" y="173.818594" transform="rotate(-0 158.4 173.818594)">Setup</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(107.4 215.916297)">建立公共参数</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(115.9 239.846984)">与验证材料</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="435.6" y="173.818594" transform="rotate(-0 435.6 173.818594)">Session 初始化</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(371.001328 215.916297)">构造初始 anchor</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(359.1 239.846984)">建立缓存与更新状态</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="712.8" y="174.162344" transform="rotate(-0 712.8 174.162344)">Update 循环</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(661.8 215.916297)">接收一致变更</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(644.8 239.846984)">检查并生成新证明</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="990" y="173.818594" transform="rotate(-0 990 173.818594)">公开验证</text>
   </g>
   <g id="text_10">
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(922 215.916297)">检查当前公开输入</text>
    <text style="font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(939 239.846984)">与证明的关系</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="270" y="371.818594" transform="rotate(-0 270 371.818594)">独立 Prove API</text>
   </g>
   <g id="text_12">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(142.479844 412.039406)">也可单独生成初始 proof 与 aux</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(124.375781 437.377781)">它与 Session 初始化的计时边界不同</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="851.4" y="371.818594" transform="rotate(-0 851.4 371.818594)">必要时推进 Rebuild</text>
   </g>
   <g id="text_14">
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(678.74625 411.062836)">冻结快照 → 按预算分步重建 → 检查后切换</text>
    <text style="font-size: 18px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #172b3a" transform="translate(691.669688 437.547164)">冻结后的新变化放在 overlay，不能丢失</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #172b3a" x="576" y="550.760156" transform="rotate(-0 576 550.760156)">证明结构：anchor + 可选 delta + 版本号</text>
   </g>
   <g id="text_16">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #627382" x="39.6" y="628.093281" transform="rotate(-0 39.6 628.093281)">依据 ffc7775 核心流程；原理示意。当前为 ToyCircuit 未加掩码研究原型。</text>
   </g>
  </g>
 </g>
